# ### workspace-root
# #### source: workspace
version: '3'

vars:
  # ### releaser-identity
  # #### source: releaser
  ARTIFACT_PREFIX:
    sh: jq -r '.bin | to_entries[0].key' package.json
  ARTIFACT: '{{.ARTIFACT_PREFIX}}-{{OS}}-{{if eq ARCH "arm64"}}arm64{{else}}x64-baseline{{end}}'
  ENTRY:
    sh: jq -r '.bin | to_entries[0].value' package.json

includes:
  # ### releaser-compile-include
  # #### source: releaser
  compile: tasks/Taskfile.compile.yaml
  secret: tasks/Taskfile.secret.yaml
  # ### bun-base-test-includes
  # #### source: bun-base
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
      CONFIG: bunfig.unit.toml
  int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
      CONFIG: bunfig.int.toml

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh
      # ### bun-base-setup
      # #### source: bun-base
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### bun-base-tasks
  # #### source: bun-base
  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - rm -rf dist prebuilt coverage
      - '[ -d node_modules ] && find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'

  build:
    desc: Build the Bun bundle to dist/
    cmds:
      - ./scripts/local/build.sh

  deadcode:
    desc: Review strict and LLM-assisted dead-code findings
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration, and SIT suites without coverage
    cmds:
      - task: unit:default
      - task: int:default
      - task: test:sit

  test:unit:
    desc: Run the unit suite without coverage
    cmds:
      - task: unit:default

  test:int:
    desc: Run the integration suite without coverage
    cmds:
      - task: int:default

  test:sit:
    desc: Run black-box journeys through the freshly compiled binary
    deps: [compile]
    cmds:
      - SIT_DRIVER=binary CLI_BIN=dist/bin/{{.ARTIFACT}} bun test --config=bunfig.sit.toml

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - task: unit:coverage
      - task: int:coverage
      - task: test:sit:coverage

  test:unit:coverage:
    desc: Run the unit suite with coverage
    cmds:
      - task: unit:coverage

  test:int:coverage:
    desc: Run the integration suite with coverage
    cmds:
      - task: int:coverage

  test:sit:coverage:
    desc: Run SIT journeys in-process and emit the full-system ledger
    cmds:
      - rm -rf coverage/sit
      - SIT_DRIVER=inprocess bun test --config=bunfig.sit.toml --coverage
      - test -f coverage/sit/lcov.info

  test:watch:
    desc: Watch the fast unit suite
    cmds:
      - task: unit:watch

  run:
    desc: Run the CLI source entry point
    cmds:
      - bun run {{.ENTRY}} -- {{.CLI_ARGS}}

  preview:
    desc: Run this host's compiled standalone binary
    deps: [compile]
    cmds:
      - ./dist/bin/{{.ARTIFACT}} {{.CLI_ARGS}}
