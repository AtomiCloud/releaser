schemaVersion: 2

types:
  - type: amend
    desc: Small amendments and typo fixes
    scopes:
      default: { desc: Amend existing work, release: false }
  - type: build
    desc: Build-system changes
    scopes:
      default: { desc: Update build machinery, release: false }
  - type: chore
    desc: Repository chores
    scopes:
      default: { desc: Perform a chore, release: false }
  - type: ci
    desc: CI/CD changes
    scopes:
      default: { desc: Update CI/CD, release: false }
  - type: config
    desc: Configuration changes
    scopes:
      default: { desc: Update configuration, release: false }
  - type: dep
    desc: Dependency updates
    section: 🔼 Dependency Upstreams 🔼
    scopes:
      default: { desc: Update a dependency, release: false }
      patch: { desc: Patch dependency update, release: patch }
      minor: { desc: Minor dependency update, release: minor }
      major: { desc: Major dependency update, release: major }
  - type: docs
    desc: Documentation changes
    section: 📜 Documentation 📜
    scopes:
      default: { desc: Update documentation, release: false }
  - type: feat
    desc: New features
    section: ✨ Features ✨
    vae:
      verb: add
      application: <scope>, <title>
      example: 'feat: add a release capability'
    scopes:
      default: { desc: Add a feature, release: minor }
      breaking: { desc: Add a breaking feature, release: major }
  - type: fix
    desc: Bug fixes
    section: 🐛 Bug Fixes 🐛
    vae:
      verb: fix
      application: <title>
      example: 'fix: preserve changelog preamble'
    scopes:
      default: { desc: Fix a bug, release: patch }
  - type: perf
    desc: Performance improvements
    section: 🚀 Performance Improvement 🚀
    scopes:
      default: { desc: Improve performance, release: patch }
  - type: refactor
    desc: Refactors
    scopes:
      default: { desc: Refactor implementation, release: minor }
  - type: style
    desc: Non-functional style changes
    scopes:
      default: { desc: Update style, release: patch }
  - type: test
    desc: Test changes
    section: 🧪 Tests 🧪
    scopes:
      default: { desc: Add or correct tests, release: minor }

specialScopes:
  no-release: { desc: Prevent release from happening, release: false }

keywords: [BREAKING CHANGE, BREAKING CHANGES, BREAKING]

lint:
  header:
    maxLength: 72
    minLength: 5
    forbiddenWords: [WIP]
    forbidTrailingPunctuation: true
  body:
    maxLineLength: 80
    minLengthWhenPresent: 20
    requireBlankSecondLine: true
  ignore: [merge, revert, fixup, fixup-amend, squash]

conventions:
  path: docs/developer/CommitConventions.md
  template: |-
    # Commit conventions

    CONVENTION_DOCS_PLACEHOLDER

release:
  branches: [main]
  tagFormat: 'v${version}'
  changelog:
    path: Changelog.md
    title: '# Changelog'
  commit:
    message: |-
      release: ${version}

      ${notes}
    assets:
      - Changelog.md
      - Changelog.old.md
      - package.json
      - VERSION
      - docs/developer/CommitConventions.md
  github: false
  hooks:
    prepare:
      - phase: beforeWrite
        command: ./scripts/release/backup-changelog.sh
      - phase: afterWrite
        command: ./scripts/release/bump.sh ${version}
    success: []
