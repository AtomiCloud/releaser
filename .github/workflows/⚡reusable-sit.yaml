# ### releaser-reusable-sit
# #### source: releaser
name: ⚡ Reusable SIT
on:
  workflow_call:
jobs:
  sit:
    name: SIT
    runs-on: ubuntu-24.04
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.cache-bun@v2
        with:
          namespacelabs: 'false'
      - name: Download compiled binaries
        uses: actions/download-artifact@v8
        with:
          name: cli-binaries
          path: dist
      - name: Restore executable modes from the archive
        run: tar -xzf dist/cli-binaries.tar.gz -C dist
      - name: Run SIT
        env:
          CLI_BIN: dist/bin/releaser-linux-x64-baseline
        run: nix develop .#ci -c ./scripts/ci/test.sh sit
