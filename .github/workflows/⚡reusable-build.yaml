# ### bun-base-reusable-build
# #### source: bun-base
name: ⚡ Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.cache-bun@v2
        with:
          namespacelabs: 'false'
      - name: Build sample bundle
        run: nix develop .#ci -c ./scripts/ci/build.sh
